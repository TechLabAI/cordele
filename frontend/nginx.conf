# Reverse-proxy + static file server for cordele-web (container runtime).
#
# Rationale (Problem 1):
#   `serve -s` only does SPA fallback — it cannot proxy API calls.
#   nginx replaces it here so the same image handles both static assets
#   (SPA, /index.html fallback) and API routing to the four backend services.
#
# API routing (path prefix → upstream):
#   /api/v1/imp/  → imp-service:3000
#   /api/v1/comp/ → comp-service:3000
#   /api/v1/pub/  → pub-service:3000
#   /api/v1/proj/ → proj-service:3000
#
# DNS resilience: Docker's embedded resolver (127.0.0.11) is declared so
# upstream names are resolved at request time, not at nginx startup.  This
# prevents startup failure when a sibling service restarts.
#
# Port 4500 matches the published port in docker-compose.dev.yml.

server {
    listen 4500;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — required for variable-based proxy_pass
    # to avoid "no resolver defined" error and to handle service restarts.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # -------------------------------------------------------------------------
    # API proxy — four location blocks, one per backend service
    # The $request_uri variable carries the full path + query string, so no
    # path rewriting is needed: /api/v1/proj/projetos arrives at proj-service
    # as /api/v1/proj/projetos unchanged.
    # -------------------------------------------------------------------------

    location /api/v1/imp/ {
        set $upstream_imp imp-service:3000;
        proxy_pass http://$upstream_imp$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/v1/comp/ {
        set $upstream_comp comp-service:3000;
        proxy_pass http://$upstream_comp$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/v1/pub/ {
        set $upstream_pub pub-service:3000;
        proxy_pass http://$upstream_pub$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/v1/proj/ {
        set $upstream_proj proj-service:3000;
        proxy_pass http://$upstream_proj$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — Angular client-side routing
    # Any path that does not resolve to a real file gets /index.html so the
    # Angular router can handle it on the client.
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
